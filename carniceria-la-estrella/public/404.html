<style>
  @font-face { font-family: "Playfair Display"; font-weight: 600 900; font-display: swap; src: url("assets/fonts/playfair.woff2") format("woff2"); }
  @font-face { font-family: "Karla"; font-weight: 400 700; font-display: swap; src: url("assets/fonts/karla.woff2") format("woff2"); }
  :root {
    --cream: #f5ead3; --ink: #2a1d17; --maroon: #7a1f2a;
    --font-display: "Playfair Display", Georgia, serif;
    --font-body: "Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--cream); color: var(--ink); font-family: var(--font-body); }
  main { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.4rem; text-align: center; padding: calc(2rem + env(safe-area-inset-top, 0px)) calc(1.25rem + env(safe-area-inset-right, 0px)) calc(2rem + env(safe-area-inset-bottom, 0px)) calc(1.25rem + env(safe-area-inset-left, 0px)); }
  svg.mark { width: 60px; height: 60px; }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 1.5rem + 2vw, 3rem); margin: 0.3em 0 0; }
  p { max-width: 42ch; margin: 0; color: #4a3a30; font-size: 1.05rem; }
  .code { font-family: var(--font-body); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.16em; color: var(--maroon); text-transform: uppercase; }
  a.btn {
    display: inline-flex; align-items: center; gap: 0.5em; margin-top: 0.6rem;
    background: var(--maroon); color: #fff; font-weight: 700; text-decoration: none;
    padding: 0.85em 1.8em; border-radius: 999px; box-shadow: 0 8px 20px -8px rgba(122,31,42,0.5);
    transition: transform 0.18s;
  }
  a.btn:hover { transform: translateY(-2px); }
  :focus-visible { outline: 3px solid var(--maroon); outline-offset: 2px; }
  @view-transition { navigation: auto; }
  main svg.mark { view-transition-name: site-logo; }
</style>
</head>

  <main>
    <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
