[build]
  publish = "public"
  # Regenera lib/*.generado.mjs (plantillas y datos por defecto) antes de empaquetar las funciones.
  command = "node scripts/empaquetar.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cabeceras de seguridad para los archivos estáticos (css, js, imágenes, panel, 404...).
# Las páginas que genera una función (portada, tienda, privacidad, aviso legal) llevan las suyas
# desde el propio código, con su CSP calculada para esa página.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; frame-src https://www.google.com; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# El panel no se indexa ni se guarda en cachés.
[[headers]]
  for = "/admin/"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Solo las fuentes llevan caché de un año: no cambian nunca. Scripts, estilos y fotos
# usan la caché por defecto de Netlify (se revalidan en cada visita).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
